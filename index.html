<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optivex Robotics</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #050810;
    --deep: #080d1a;
    --steel: #0d1b2e;
    --accent: #00d4ff;
    --accent2: #0066ff;
    --glow: rgba(0, 212, 255, 0.18);
    --dim: rgba(0, 212, 255, 0.06);
    --text: #c8dff0;
    --muted: rgba(180, 210, 230, 0.4);
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
  }

  .bg {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #050810 0%, #080d1a 40%, #050e1f 100%);
    z-index: 0;
  }

  .grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.07) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridShift 20s linear infinite;
    z-index: 1;
  }

  @keyframes gridShift {
    0% { transform: perspective(600px) rotateX(15deg) translateY(0); }
    100% { transform: perspective(600px) rotateX(15deg) translateY(60px); }
  }

  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(5,8,16,0.9) 100%);
    z-index: 2;
  }

  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    z-index: 3;
    pointer-events: none;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    z-index: 1;
    animation: float 12s ease-in-out infinite;
  }
  .orb1 { width: 400px; height: 400px; background: #0066ff; top: -100px; left: -80px; animation-delay: 0s; }
  .orb2 { width: 300px; height: 300px; background: #00d4ff; bottom: -80px; right: -60px; animation-delay: -5s; }
  .orb3 { width: 200px; height: 200px; background: #0044cc; top: 50%; left: 55%; animation-delay: -8s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(20px, -30px) scale(1.05); }
    66% { transform: translate(-15px, 20px) scale(0.95); }
  }

  .container {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  .logo-mark {
    width: 90px;
    height: 90px;
    margin-bottom: 2.4rem;
    position: relative;
    animation: fadeInDown 1s ease both;
  }

  .logo-mark svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 18px rgba(0,212,255,0.6));
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 0.15em;
    margin-bottom: 0.6rem;
    animation: fadeInDown 1s 0.15s ease both;
    opacity: 0;
  }

  .brand-optivex {
    font-size: clamp(2.8rem, 7vw, 5.2rem);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ffffff 0%, #00d4ff 60%, #0066ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .brand-robotics {
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    font-weight: 300;
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.85;
    margin-left: 0.3em;
    align-self: flex-end;
    padding-bottom: 0.15em;
    font-family: 'Share Tech Mono', monospace;
  }

  .divider {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 1.8rem auto;
    animation: fadeIn 1s 0.35s ease both;
    opacity: 0;
    position: relative;
  }

  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }

  .tagline {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.75rem, 2vw, 1rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0;
    animation: fadeIn 1s 0.5s ease both;
  }

  .tagline::before { content: '[ '; opacity: 0.5; }
  .tagline::after  { content: ' ]'; opacity: 0.5; }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .domain {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.25em;
    color: var(--muted);
    z-index: 10;
    animation: fadeIn 1.5s 1s ease both;
    opacity: 0;
  }

  .corner {
    position: fixed;
    width: 40px;
    height: 40px;
    z-index: 10;
    opacity: 0.4;
    animation: fadeIn 2s 0.8s ease both;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner-tl { top: 1.5rem; left: 1.5rem; }
  .corner-tr { top: 1.5rem; right: 1.5rem; transform: scaleX(-1); }
  .corner-bl { bottom: 1.5rem; left: 1.5rem; transform: scaleY(-1); }
  .corner-br { bottom: 1.5rem; right: 1.5rem; transform: scale(-1); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .status {
    margin-top: 2.8rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    animation: fadeIn 1s 0.8s ease both;
    opacity: 0;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
</style>
</head>
<body>

</html>
